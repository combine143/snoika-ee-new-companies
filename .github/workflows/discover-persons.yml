name: Discover persons file
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect records of companies without a first name
        run: |
          B="https://avaandmed.ariregister.rik.ee/sites/default/files/avaandmed/"
          curl -sSL -A "snoika-ee-new-companies/1.0" -o p.zip "${B}ettevotja_rekvisiidid__kaardile_kantud_isikud.json.zip"
          curl -sSL -A "snoika-ee-new-companies/1.0" -o o.zip "${B}ettevotja_rekvisiidid__osanikud.json.zip"
          ls -la p.zip o.zip
          python3 - <<'EOF'
          import zipfile, json, re
          WANT = {"17641691", "17641246", "17642978", "17647504", "17645758"}
          CODE = re.compile(r'"ariregistri_kood"\s*:\s*"?(\d+)')
          def scan(path, label, head=True):
              z = zipfile.ZipFile(path)
              n = [i.filename for i in z.infolist() if i.filename.endswith(".json")][0]
              print("=====", label, n)
              if head:
                  with z.open(n) as f:
                      print("HEAD", f.read(1500).decode("utf-8", "replace"))
              left = set(WANT)
              buf, inrec, skip = [], False, None
              with z.open(n) as f:
                  for raw in f:
                      line = raw.decode("utf-8", "replace").rstrip("\r\n")
                      if not inrec:
                          if line == "    {":
                              inrec, skip, buf = True, None, ["{"]
                          continue
                      if line in ("    },", "    }"):
                          inrec = False
                          if not skip:
                              buf.append("}")
                              try:
                                  rec = json.loads("".join(buf))
                                  print("REC", label, json.dumps(rec, ensure_ascii=False)[:3500])
                                  left.discard(str(rec.get("ariregistri_kood")))
                              except ValueError:
                                  pass
                              if not left:
                                  return
                          continue
                      if skip is None:
                          m = CODE.search(line)
                          skip = not (m and m.group(1) in left)
                      if not skip:
                          buf.append(line)
              print("NOT FOUND:", sorted(left))
          scan("p.zip", "PERSONS", head=False)
          scan("o.zip", "SHAREHOLDERS", head=True)
          EOF
